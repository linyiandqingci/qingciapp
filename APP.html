<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>清辞内核</title>
<style>
*{
    box-sizing:border-box;
    margin: 0;
    padding: 0;
}
html{
    scroll-behavior: smooth;
}
body{
    margin:0;
    background:#080b14;
    color:#fff;
    font-family:Arial,"Microsoft YaHei",sans-serif;
    line-height:1.7;
}
a{
    text-decoration:none;
    color:#fff;
    transition:0.25s ease;
}
.nav{
    height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 8%;
    background:rgba(10,12,20,.75);
    backdrop-filter:blur(15px);
    position:fixed;
    top:0;
    width:100%;
    z-index:100;
}
.logo{
    font-size:24px;
    font-weight:bold;
    color:#b88cff;
}
.links{
    display:flex;
    gap:30px;
}
.links a:hover{
    color:#b88cff;
}
.section{
    padding:70px 8%;
    scroll-margin-top:80px;
}
.hero{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:90px 20px 40px;
    background:radial-gradient(circle at top,#252040,#080b14 60%);
}
h1{
    font-size:52px;
    margin:20px 0;
}
.hero p{
    color:#aaa;
    font-size:18px;
    max-width:650px;
    line-height:1.8;
}
.btn{
    display:inline-block;
    margin:20px 8px;
    padding:14px 35px;
    border-radius:30px;
    background:#9b5cff;
    transition:0.25s ease;
}
.btn:hover{
    background:#b88cff;
    transform: translateY(-2px);
}
.btn2{
    background:#222;
    border:1px solid #555;
}
.btn2:hover{
    background:#2c2c2c;
    border-color:#9b5cff;
}
.section > h2{
    font-size:32px;
    margin-bottom:35px;
    color:#e2d4ff;
}
.cards{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:25px;
}
.card{
    background:rgba(255,255,255,.08);
    border-radius:25px;
    padding:30px;
    backdrop-filter:blur(15px);
    transition:0.3s;
}
.card:hover{
    background:rgba(255,255,255,.12);
    transform: translateY(-4px);
}
.card h3{
    color:#c69cff;
    font-size:22px;
    margin-bottom:12px;
}
.card p{
    color:#cccccc;
}
.warn-text{
    color:#ffbc70;
}
.error-text{
    color:#ff7c7c;
}
.footer{
    text-align:center;
    padding:40px;
    color:#777;
}
@media(max-width:700px){
    h1{
        font-size:36px;
    }
    .links{
        gap:12px;
        font-size:14px;
    }
    .cards{
        grid-template-columns:1fr;
    }
    .section > h2{
        font-size:26px;
    }
}
</style>
</head>
<body>
<nav class="nav">
    <div class="logo">清辞内核</div>
    <div class="links">
        <a href="#">首页</a>
        <a href="#func">功能</a>
        <a href="#news">更新</a>
        <a href="#about">关于</a>
    </div>
</nav>

<section class="hero">
    <h1>清辞内核</h1>
    <p>一款优秀的内核，不需多少说辞，只用实力说话。</p>
    <div>
        <a class="btn" href="https://1844927544.share.123pan.cn/123pan/zq9iTd-Fxs1H">立即下载</a>
        <a class="btn btn2" href="#func">查看优势</a>
    </div>
</section>

<section class="section" id="func">
    <h2>核心功能</h2>
    <div class="cards">
        <div class="card">
            <h3>简介流畅</h3>
            <p>快速相应，米8也能流畅运行。</p>
        </div>
        <div class="card">
            <h3>驱动多样</h3>
            <p>提供更多的选择。</p>
        </div>
        <div class="card">
            <h3>UI美观</h3>
            <p>视觉效果一流。</p>
        </div>
    </div>
</section>

<section class="section" id="news">
    <h2>更新公告</h2>
    <div class="card" id="news-card">
        <h3>正在加载远程公告…</h3>
        <p>持续优化界面体验，增加更多功能支持。</p>
    </div>
</section>

<section class="section" id="about">
    <h2>关于</h2>
    <div class="card">
        <h3>项目介绍</h3>
        <p>清辞内核，一个追求稳定与实用的项目。</p>
    </div>
</section>

<div class="footer">© 2026 清辞内核</div>

<script>
const updateUrl = "https://cdn.jsdelivr.net/gh/linyiandqingci/updata@main/update.json";

async function loadNotice(){
    const newsDom = document.getElementById("news-card");
    try{
        const res = await fetch(updateUrl);
        if(!res.ok){
            newsDom.innerHTML = `
                <h3 class="error-text">获取公告失败</h3>
                <p>网络请求异常，无法拉取远程更新公告。</p>
                <p>持续优化界面体验，增加更多功能支持。</p>
            `;
            return;
        }
        let data;
        try{
            data = await res.json();
        }catch(parseErr){
            newsDom.innerHTML = `
                <h3 class="error-text">公告解析失败</h3>
                <p>远程JSON格式错误，请检查update.json语法。</p>
                <p>持续优化界面体验，增加更多功能支持。</p>
            `;
            return;
        }

        // 适配你真实JSON字段：versionName 版本名，updateDesc 更新公告内容
        let html = `<h3>${data.versionName}</h3>`;
        html += `<p>${data.updateDesc}</p>`;
        newsDom.innerHTML = html;

    }catch(err){
        newsDom.innerHTML = `
            <h3 class="error-text">加载公告出错</h3>
            <p>网络异常，无法访问远程更新配置。</p>
            <p>持续优化界面体验，增加更多功能支持。</p>
        `;
        console.error("loadNotice异常：",err);
    }
}

window.addEventListener("DOMContentLoaded",loadNotice);
</script>
</body>
</html>
